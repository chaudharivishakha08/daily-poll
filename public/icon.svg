<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128c7e"/>
      <stop offset="100%" stop-color="#075e54"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- White Card Container -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Poll Bars -->
  <!-- Bar 1 -->
  <rect x="130" y="270" width="50" height="110" rx="14" fill="url(#bar1)"/>
  <!-- Bar 2 -->
  <rect x="231" y="160" width="50" height="220" rx="14" fill="url(#bar2)"/>
  <!-- Bar 3 (Saffron Highlight) -->
  <rect x="332" y="210" width="50" height="170" rx="14" fill="url(#bar3)"/>
  
  <!-- Top Decorative Dots -->
  <circle cx="155" cy="245" r="12" fill="#11998e"/>
  <circle cx="256" cy="135" r="14" fill="#25d366"/>
  <circle cx="357" cy="185" r="12" fill="#ea580c"/>
  
  <!-- Subtle Checkmark Badge -->
  <circle cx="380" cy="130" r="32" fill="#25d366"/>
  <path d="M368 130 L376 138 L394 120" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
